<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmo Pro Coach</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SETUP MODAL (LOBBY) -->
    <div id="setup-modal" class="modal active">
        <div class="modal-content">
            <h2>Pre-Game Lobby</h2>
            <div class="form-group">
                <label>Player Name:</label>
                <input type="text" id="player-name" placeholder="Enter name..." value="Investigator">
            </div>
            <div class="form-group">
                <label>Player Level:</label>
                <input type="number" id="player-level" value="12" min="1" max="9999">
            </div>
                        <div class="form-group">
                <label>Map:</label>
                <select id="map-select">
                    <!-- Hărțile vor fi încărcate aici automat din JSON -->
                </select>
            </div>
            <div class="form-group">
                <label>Challenge/Difficulty:</label>
                <select id="challenge-select">
                    <option value="Normal">Normal / Professional</option>
                    <option value="Weekly">Weekly Challenge</option>
                    <option value="Nightmare">Nightmare / Insanity</option>
                </select>
            </div>
            <button onclick="startInvestigation()" class="primary-btn">Enter Truck</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="main-app hidden">
        
        <!-- HEADER -->
        <header id="app-header">
            <div class="header-logo">
                <h1>Phasmo Pro Coach</h1>
            </div>
            <div class="header-info" id="header-info">
                <!-- Populated by JS -->
            </div>
            <button onclick="location.reload()" class="danger-btn">End Run</button>
        </header>

        <main class="dashboard">
            
            <!-- LEFT COLUMN: JOURNAL & GHOSTS -->
            <aside class="column left-col">
                <div class="panel shadow-box">
                    <h2>📖 Evidence Journal</h2>
                    <div id="evidence-buttons" class="evidence-grid"></div>
                    <button id="reset-btn" class="danger-btn" style="margin-top: 15px;">Reset Evidence</button>
                </div>
                
                <div class="panel shadow-box">
                    <h2>👻 Possible Ghosts (<span id="ghost-count">30</span>)</h2>
                    <div id="ghost-list" class="ghost-list"></div>
                </div>
            </aside>

            <!-- MIDDLE COLUMN: THE BRAIN & CHECKLISTS -->
            <section class="column middle-col">
                <div class="panel shadow-box coach-panel">
                    <h2>🧠 Live Coach Feed</h2>
                    <div id="coach-feed" class="coach-feed"></div>
                </div>

                <div class="panel shadow-box">
                    <h2>✅ Master Field Checklist</h2>
                    <div id="master-checklist" class="checkbox-grid">
                        <!-- Populated dynamically by JS -->
                    </div>
                </div>

                <div class="panel shadow-box" style="border-color: #7986cb;">
                    <h2 style="color: #64b5f6;">⚠️ Anomalies & Expert Tells</h2>
                    <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Check an event if it happens. The AI will auto-eliminate ghosts.</p>
                    <div id="anomaly-grid" class="checkbox-grid">
                        <label><input type="checkbox" onchange="toggleAnomaly('mistEvent', this.checked)"> Mist/Airball Event</label>
                        <label><input type="checkbox" onchange="toggleAnomaly('singingEvent', this.checked)"> Singing Event</label>
                        <label><input type="checkbox" onchange="toggleAnomaly('turnedOnLight', this.checked)"> Turned ON a light/TV</label>
                        <label><input type="checkbox" onchange="toggleAnomaly('breakerOff', this.checked)"> Turned OFF Breaker</label>
                        <label><input type="checkbox" onchange="toggleAnomaly('breakerOn', this.checked)"> Turned ON Breaker</label>
                        <label><input type="checkbox" onchange="toggleAnomaly('chaseEvent', this.checked)"> Chasing Ghost Event</label>
                    </div>
                </div>
            </section>

            <!-- RIGHT COLUMN: INTEL, SURVIVAL & LOADOUT -->
            <aside class="column right-col">
                <div class="panel shadow-box" style="border-color: var(--danger);">
                    <h2 style="color: var(--danger);">🚨 Hunt Protocols</h2>
                    <div id="hunt-protocols" class="hunt-tips-box">
                        <!-- Dynamic survival tips go here -->
                    </div>
                </div>

                <div class="panel shadow-box">
                    <h2>📋 Board Intel</h2>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>Ghost Gender:</label>
                        <select id="gender-select" onchange="updateGender()">
                            <option value="Unknown">Unknown</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="panel shadow-box">
                    <h2>🎒 Loadout Recommender</h2>
                    <div id="loadout-tips" class="loadout-tips">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </aside>

        </main>

    <script src="app.js"></script>
</body>
</html>
